<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" style="max-width:100%;height:auto" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">HereToPlan — Entrega estática y datos por origen</title>
  <desc id="descripcion">GitHub verifica las PR. Un push a main que supera calidad publica dist en Pages. El navegador ejecuta cuatro rutas hash y conserva IndexedDB y la preferencia de guía en localStorage. El respaldo se traslada mediante una acción explícita y no contiene la guía.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <style>
      .fondo { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .cabecera { fill: #dbeafe; }
      .local { fill: #f0fdf4; stroke: #15803d; }
      .preferencia { fill: #fffbeb; stroke: #a16207; }
      .titulo { font: 700 30px Segoe UI, sans-serif; fill: #0f172a; }
      .nombre { font: 700 19px Segoe UI, sans-serif; fill: #0f172a; }
      .texto { font: 400 16px Segoe UI, sans-serif; fill: #334155; }
      .nota { font: 400 14px Segoe UI, sans-serif; fill: #475569; }
      .flecha { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#flecha); }
      .ambos { marker-start: url(#flecha); }
      .limite { fill: #eff6ff; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 6; rx: 18; }
    </style>
  </defs>
  <rect class="fondo" width="1400" height="920"/>
  <text class="titulo" x="48" y="56">HereToPlan — Entrega estática y datos por origen</text>
  <text class="texto" x="48" y="88">El código se publica; el estado personal permanece en el navegador. Corte: 2026-10-09.</text>

  <g transform="translate(48 132)">
    <rect class="panel" width="290" height="176"/>
    <text class="nombre" x="20" y="38">Repositorio GitHub</text>
    <text class="texto" x="20" y="72">Código, lockfile y workflow</text>
    <text class="texto" x="20" y="101">PR hacia main: sólo calidad</text>
    <text class="texto" x="20" y="130">Push a main: calidad y Pages</text>
    <text class="nota" x="20" y="157">Tablero: alcance y revisión</text>
  </g>
  <g transform="translate(438 132)">
    <rect class="panel" width="390" height="176"/>
    <text class="nombre" x="20" y="38">Actions · calidad</text>
    <text class="texto" x="20" y="72">Node del pin y npm ci</text>
    <text class="texto" x="20" y="101">Formato · lint · docs · CSS · axe</text>
    <text class="texto" x="20" y="130">Suite/cobertura · build · verify:pages</text>
    <text class="nota" x="20" y="157">Resultado: artefacto dist verificado</text>
  </g>
  <g transform="translate(928 132)">
    <rect class="panel" width="424" height="176"/>
    <text class="nombre" x="20" y="38">Actions · desplegar → Pages</text>
    <text class="texto" x="20" y="72">Requiere calidad exitosa y push a main</text>
    <text class="texto" x="20" y="101">Publica el mismo artefacto</text>
    <text class="texto" x="20" y="130">Base /HereToPlan/ · HTTPS</text>
    <text class="nota" x="20" y="157">pages: write · id-token: write</text>
  </g>
  <path class="flecha" d="M340 220 H436"/>
  <path class="flecha" d="M830 220 H926"/>

  <rect class="limite" x="48" y="364" width="1304" height="418"/>
  <text class="nombre" x="72" y="402">Navegador y perfil · un origen (protocolo + host + puerto)</text>
  <g transform="translate(88 450)">
    <rect class="panel" width="342" height="258"/>
    <text class="nombre" x="20" y="38">SPA · React + HashRouter</text>
    <text class="texto" x="20" y="78">#/calendario · #/crear</text>
    <text class="texto" x="20" y="106">#/puntos · #/respaldo</text>
    <text class="texto" x="20" y="146">Casos de uso y puertos</text>
    <text class="texto" x="20" y="174">Sin backend ni cuentas</text>
    <text class="nota" x="20" y="215">Perfil, HUD y tutorial opcional</text>
    <text class="nota" x="20" y="239">Las rutas hash no piden otra página</text>
  </g>
  <g transform="translate(556 450)">
    <rect class="panel local" width="354" height="258"/>
    <text class="nombre" x="20" y="38">IndexedDB v13</text>
    <text class="texto" x="20" y="78">Quince colecciones funcionales</text>
    <text class="texto" x="20" y="106">Perfil y planificación</text>
    <text class="texto" x="20" y="134">Historia y economías</text>
    <text class="texto" x="20" y="174">Transacciones atómicas</text>
    <text class="nota" x="20" y="215">Exportar / restaurar: JSON V3</text>
    <text class="nota" x="20" y="239">Reiniciar conserva historia y economía</text>
  </g>
  <g transform="translate(1004 450)">
    <rect class="panel preferencia" width="310" height="258"/>
    <text class="nombre" x="20" y="38">localStorage · guía</text>
    <text class="texto" x="20" y="78">Una preferencia V1</text>
    <text class="texto" x="20" y="106">Situación y paso actual</text>
    <text class="texto" x="20" y="146">Reiniciar guía: sólo aquí</text>
    <text class="texto" x="20" y="174">Recuperación explícita</text>
    <text class="nota" x="20" y="215">No forma parte del respaldo</text>
    <text class="nota" x="20" y="239">No guarda datos de planificación</text>
  </g>
  <path class="flecha" d="M1140 310 V350 H64 V432 H260 V448"/>
  <text class="nota" x="570" y="342">descarga HTML, JS, CSS y recursos</text>
  <path class="flecha ambos" d="M432 530 H554"/>
  <text class="nota" x="449" y="516">puertos</text>
  <path class="flecha" d="M432 490 H474 V424 H1160 V448"/>
  <text class="nota" x="820" y="440">puerto independiente de preferencias</text>

  <path class="flecha ambos" d="M732 710 V804"/>
  <rect class="panel local" x="556" y="808" width="514" height="78"/>
  <text class="nombre" x="576" y="838">Archivo de respaldo · acción del usuario</text>
  <text class="nota" x="576" y="864">Texto JSON sin cifrado propio; traslada datos, no la guía.</text>
  <text class="nota" x="48" y="834">Otro navegador u origen:</text>
  <text class="nota" x="48" y="858">espacio de datos distinto,</text>
  <text class="nota" x="48" y="882">sin sincronización automática.</text>
</svg>
